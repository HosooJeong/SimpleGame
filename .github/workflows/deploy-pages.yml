name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scoring
        run: |
          node --check experiments/canvas-full/app.js
          node --check experiments/canvas-full/sw.js
          node --check experiments/canvas-full/version.js
          node experiments/canvas-full/scoring.test.cjs
          node experiments/canvas-full/service_worker.test.cjs
          node experiments/canvas-full/version.test.cjs
      - name: Install font subsetter
        run: python -m pip install fonttools==4.58.5
      - name: Build Canvas site
        run: python experiments/canvas-full/build.py --output "${{ runner.temp }}/canvas-site" --version "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/canvas-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
