name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --base-href /SimpleGame/

      # 폰트를 소스가 실제로 쓰는 글자만 남기고 줄인다(약 6MB -> 0.7MB).
      # 원본은 assets/fonts/ 에 그대로 두고 빌드 산출물만 깎는다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Subset fonts
        run: |
          python -m pip install --quiet fonttools
          python tool/subset_fonts.py build/web

      # 앱 코드 캐시는 커밋 해시로, 자산 캐시는 자산 내용 해시로 키를 잡는다.
      # 코드만 바뀐 배포에서는 자산 캐시가 살아남아 canvaskit을 다시 받지 않는다.
      - name: Stamp service worker versions
        run: |
          ASSET_VERSION=$(find build/web/canvaskit build/web/assets -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" build/web/sw.js
          sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g" build/web/sw.js
          if grep -q "__BUILD_VERSION__\|__ASSET_VERSION__" build/web/sw.js; then
            echo "치환 실패: sw.js에 플레이스홀더가 남아있음"
            exit 1
          fi
          grep -E "^const (APP|ASSET)_VERSION = " build/web/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
